name: Cutset impact review

on:
  pull_request_target:
    paths:
      - "**/*.sql"
      - "**/*.yml"
      - "**/*.yaml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    environment: datahub-review
    steps:
      - name: Check out trusted Cutset engine
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: cutset-engine

      - name: Check out untrusted candidate as data only
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Fetch target base into candidate repository
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git -C candidate fetch --no-tags \
            "https://github.com/${BASE_REPOSITORY}.git" \
            "${BASE_SHA}:refs/cutset/base"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Cutset
        run: python -m pip install ./cutset-engine

      - name: Review schema impact
        id: cutset
        env:
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
          DATAHUB_GMS_TOKEN: ${{ secrets.DATAHUB_GMS_TOKEN }}
        run: |
          set +e
          cutset review \
            --repo candidate \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --repository-id "${{ github.repository }}" \
            --output cutset-output \
            --write-back
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish job summary
        if: always()
        run: |
          if [[ -f cutset-output/impact-report.md ]]; then
            cat cutset-output/impact-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload impact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutset-impact-review
          path: cutset-output/
          if-no-files-found: warn

      - name: Enforce Cutset verdict
        if: always()
        run: exit "${{ steps.cutset.outputs.exit_code || '6' }}"
