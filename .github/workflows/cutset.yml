name: Cutset impact review

on:
  pull_request:
    paths:
      - "**/*.sql"
      - "**/*.yml"
      - "**/*.yaml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Cutset
        run: python -m pip install .

      - name: Review schema impact
        id: cutset
        env:
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
          DATAHUB_GMS_TOKEN: ${{ secrets.DATAHUB_GMS_TOKEN }}
        run: |
          set +e
          cutset review \
            --repo . \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --repository-id "${{ github.repository }}" \
            --output cutset-output \
            --write-back
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload impact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutset-impact-review
          path: cutset-output/
          if-no-files-found: warn

      - name: Enforce Cutset verdict
        if: always()
        run: exit "${{ steps.cutset.outputs.exit_code || '6' }}"
