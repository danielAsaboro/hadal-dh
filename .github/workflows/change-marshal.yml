name: ChangeMarshal governed change plan

on:
  pull_request_target:
    paths:
      - "**/*.sql"
      - "**/*.yml"
      - "**/*.yaml"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: datahub-review
    steps:
      - name: Check out trusted ChangeMarshal engine
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: change-marshal-engine

      - name: Check out untrusted candidate as Git data only
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false

      - name: Fetch target base into candidate repository
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          git -C candidate fetch --no-tags
          "https://github.com/${BASE_REPOSITORY}.git"
          "${BASE_SHA}:refs/changemarshal/base"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: change-marshal-engine/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install trusted engine and official DataHub MCP server
        working-directory: change-marshal-engine
        run: |
          npm ci
          python -m venv .mcp-venv
          .mcp-venv/bin/pip install 'git+https://github.com/acryldata/mcp-server-datahub.git@v0.6.0'

      - name: Compile and persist governed case
        working-directory: change-marshal-engine
        env:
          CHANGEMARSHAL_DATAHUB_MCP_COMMAND: ${{ github.workspace }}/change-marshal-engine/.mcp-venv/bin/mcp-server-datahub
          DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
          DATAHUB_GMS_TOKEN: ${{ secrets.DATAHUB_GMS_TOKEN }}
          TOOLS_IS_MUTATION_ENABLED: "true"
          DATA_QUALITY_TOOLS_ENABLED: "true"
          SAVE_DOCUMENT_TOOL_ENABLED: "true"
          SAVE_DOCUMENT_RESTRICT_UPDATES: "false"
        run: |
          npm run changemarshal -- case plan \
            --repo "${{ github.workspace }}/candidate" \
            --repository "${{ github.repository }}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --output change-marshal-output/case.json

      - name: Publish case summary
        if: always()
        working-directory: change-marshal-engine
        run: |
          if [[ -f change-marshal-output/case.json ]]; then
            jq -r '"## ChangeMarshal\n\n- State: `\(.state)`\n- Case: `\(.caseKey)`\n- Revision: `\(.revision.revisionKey)`\n- Blockers: \(.admission.blockers | length)"' change-marshal-output/case.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload canonical case
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: change-marshal-change-case
          path: change-marshal-engine/change-marshal-output/case.json
          if-no-files-found: error

      - name: Fail closed until coordination is complete
        working-directory: change-marshal-engine
        run: jq -e '.dataHub.verified == true and .admission.allowed == true' change-marshal-output/case.json
